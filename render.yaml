services:
  - type: web
    name: asas-lims-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: LIMS_DB_PATH
        value: /opt/render/project/src/storage/lims.db
      - key: LIMS_BACKUP_DIR
        value: /opt/render/project/src/storage/backups
      - key: LIMS_QUALITY_UPLOADS
        value: /opt/render/project/src/storage/uploads/quality
      - key: LIMS_RECORD_UPLOADS
        value: /opt/render/project/src/storage/uploads/records
      - key: LIMS_SESSION_TTL_SECONDS
        value: 43200
      - key: LIMS_LOGIN_WINDOW_SECONDS
        value: 900
      - key: LIMS_LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LIMS_ALLOWED_ORIGIN
        value: https://osamababeker4-netizen.github.io
      - key: LIMS_BOOTSTRAP_PASSWORD
        sync: false
      - key: LIMS_TIME_ZONE
        value: Asia/Riyadh
      - key: TZ
        value: Asia/Riyadh
      - key: BALADY_API_BASE_URL
        sync: false
      - key: BALADY_API_TOKEN
        sync: false
      - key: BALADY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
    disk:
      name: lims-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
