name: نشر واجهة أساس على GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v4

      - name: إعداد Pages
        uses: actions/configure-pages@v5

      - name: تجهيز ملفات الواجهة
        run: |
          mkdir _site
          cp index.html style.css app.js runtime-config.js logo.jpg manifest.webmanifest sw.js _site/

      - name: رفع الواجهة الثابتة
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
