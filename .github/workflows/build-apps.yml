name: Build ASAS 8.1 preview applications
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'LIMS_Asas_Integrated_V7.0.0_BASE_READY/field/**', '.github/workflows/build-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build full system and separate field preview
        run: |
          gradle -p desktop/android assembleDebug --no-daemon
          gradle -p LIMS_Asas_Integrated_V7.0.0_BASE_READY/field assembleDebug --no-daemon
          mkdir artifacts
          cp desktop/android/app/build/outputs/apk/debug/app-debug.apk artifacts/ASAS-LIMS-8.1.0-Android-Preview.apk
          cp LIMS_Asas_Integrated_V7.0.0_BASE_READY/field/app/build/outputs/apk/debug/app-debug.apk artifacts/ASAS-Field-8.1.0-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ASAS-Android-8.1.0-Preview
          path: artifacts/*.apk
